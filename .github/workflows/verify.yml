name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run verify:system-release
      - run: bun run verify:linux-service

  macos-service:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run verify:macos-service
